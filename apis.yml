description: 'Labelbox is an enterprise-grade data labeling and AI training data platform
  that enables teams to build, manage, and evaluate machine learning models. The platform
  provides a REST API and a GraphQL API (endpoint: https://api.labelbox.com/graphql)
  for programmatic access to datasets, annotation projects, labels, ontologies, and
  model evaluation workflows. Labelbox strongly recommends using its official Python
  SDK rather than querying the GraphQL API directly, as GraphQL endpoints may change
  without notice. The platform also supports JavaScript/TypeScript through a Node.js
  SDK and offers notebook-based examples via its GitHub organization.

  '
